  </script>
  <script>
    (() => {
      const root = document.getElementById("omuse-project-guide");
      if (!root) return;
      const dataNode = document.getElementById("omuse-guide-data");
      const data = JSON.parse(dataNode.textContent);
      const statusById = new Map(data.statusDefinitions.map(status => [status.id, status]));

      const element = (tag, className, text) => {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = String(text).replace(/`([^`]+)`/g, "$1");
        return node;
      };

      const statusDot = status => {
        const dot = element("span", "status-dot");
        dot.dataset.status = status;
        dot.setAttribute("aria-hidden", "true");
        return dot;
      };

      root.querySelector("#omuse-release-state").textContent = data.releaseState;
      root.querySelector("#omuse-release-scope").textContent = data.releaseScope;
      root.querySelector("#omuse-snapshot-date").textContent = data.snapshotDate;

      const itemCount = data.categories.reduce((total, category) => total + category.items.length, 0);
      root.querySelector("#omuse-feature-count").textContent = itemCount + " feature families";

      const snapshot = root.querySelector("#omuse-snapshot");
      data.releaseSnapshot.forEach(metric => {
        const card = element("article", "card viz-stat");
        card.append(
          element("div", "text-small", metric.label),
          element("div", "viz-stat-value", metric.value),
          element("div", "text-small", metric.detail)
        );
        snapshot.append(card);
      });

      const legend = root.querySelector("#omuse-status-legend");
      data.statusDefinitions.forEach(status => {
        const key = element("div", "status-key text-small");
        key.append(statusDot(status.id), element("span", "", status.label));
        key.dataset.tooltip = status.meaning;
        legend.append(key);
      });

      const categorySelect = root.querySelector("#omuse-category-select");
      const panel = root.querySelector("#omuse-category-panel");

      const appendEvidence = (container, item) => {
        const details = element("details", "text-small");
        const summary = element("summary", "", "Evidence and source paths");
        details.append(summary);
        const grid = element("div", "evidence-grid");
        const evidenceGroup = element("div");
        evidenceGroup.append(element("div", "", "Evidence"));
        const evidenceList = element("ul");
        item.evidence.forEach(path => {
          const listItem = element("li");
          listItem.append(element("code", "", path));
          evidenceList.append(listItem);
        });
        evidenceGroup.append(evidenceList);

        const sourceGroup = element("div");
        sourceGroup.append(element("div", "", "Implementation"));
        const sourceList = element("ul");
        if (item.modules.length === 0) {
          sourceList.append(element("li", "", "No shipped implementation path"));
        } else {
          item.modules.forEach(path => {
            const listItem = element("li");
            listItem.append(element("code", "", path));
            sourceList.append(listItem);
          });
        }
        sourceGroup.append(sourceList);
        grid.append(evidenceGroup, sourceGroup);
        details.append(grid);
        container.append(details);
      };

      const renderCategory = index => {
        const category = data.categories[index];
        panel.replaceChildren();

        const heading = element("div", "category-heading");
        const titleGroup = element("div", "category-title");
        const icon = element("i");
        icon.dataset.lucide = category.icon;
        icon.setAttribute("aria-hidden", "true");
        const copy = element("div", "category-copy");
        copy.append(
          element("h2", "", category.name),
          element("div", "category-summary", category.summary)
        );
        titleGroup.append(icon, copy);
        heading.append(
          titleGroup,
          element("span", "text-small", category.items.length + " feature families")
        );
        panel.append(heading);

        const list = element("div", "feature-list");
        category.items.forEach(item => {
          const row = element("article", "feature-row");
          const identity = element("div", "feature-identity");
          const titleLine = element("div", "feature-title-line");
          titleLine.append(statusDot(item.status), element("span", "feature-name", item.name));
          const status = statusById.get(item.status);
          identity.append(titleLine, element("span", "text-small", status.label));

          const detail = element("div", "feature-detail");
          detail.append(
            element("p", "feature-current", item.current),
            element("p", "feature-boundary text-small", item.boundary)
          );
          appendEvidence(detail, item);
          row.append(identity, detail);
          list.append(row);
        });
        panel.append(list);
        if (window.lucide && typeof window.lucide.createIcons === "function") {
          window.lucide.createIcons({ attrs: { width: 16, height: 16 } });
        }
      };

      data.categories.forEach((category, index) => {
        const option = element("option", "", category.name);
        option.value = String(index);
        categorySelect.append(option);
      });
      categorySelect.addEventListener("change", event => {
        renderCategory(Number(event.currentTarget.value));
      });

      renderCategory(0);
    })();
  </script>
</section>
