[package]
name = "omuse"
version = "0.10.0"
edition = "2024"
license = "MIT"

[features]
ui-test = ["gpui-kit/test-support"]

[dependencies]
gpui-kit = { version = "=0.6.6", default-features = false, features = ["assets"] }
gpui-omarchy = { git = "https://github.com/huacnlee/gpui-omarchy", rev = "3625c6cb5f02ec38a970939e52cfdb0c374c7791" }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "tiff", "gif", "bmp"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
anyhow = "1"
i_overlay = { version = "=1.9.4", default-features = false }
kurbo = "=0.13.1"
linesweeper = "=0.4.0"
photocraft-psd = { path = "vendor/photocraft-psd" }
cosmic-text = "0.19"
libloading = "=0.8.9"
flate2 = "=1.1.10"
png = "=0.18.1"
tiff = "=0.11.3"
resvg = { version = "=0.46.0", default-features = false, features = ["text", "system-fonts", "raster-images"] }
roxmltree = "=0.21.1"
svg2pdf = { version = "=0.13.0", default-features = false }

# Windows has no system LittleCMS; compile the crate's bundled copy statically.
[target.'cfg(windows)'.dependencies]
lcms2-sys = { version = "=4.0.7", default-features = false, features = ["static"] }
dunce = "=1.0.5"
dirs = "=6.0.0"
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_System_Threading"] }

# Windows: embed the application icon and version information (see build.rs).
[target.'cfg(windows)'.build-dependencies]
embed-resource = "=3.0.11"

[dev-dependencies]
tempfile = "3"

[profile.release]
debug = false
strip = "debuginfo"

[profile.release.package.gpui-pre-macros]
debug-assertions = true

[patch.crates-io]
gpui-pre = { path = "vendor/gpui-pre" }
gpui-pre-linux = { path = "vendor/gpui-pre-linux" }
# Complete provenance and regression coverage: docs/rust-license-findings.md.
hexf-parse = { path = "vendor/hexf-parse" }
mac = { path = "vendor/mac-compat" }
