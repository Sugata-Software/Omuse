[package]
name = "photocraft-psd"
description = "Faithful, lossless reader and writer for Adobe Photoshop PSD (v1) and PSB (v2) files"
version = "0.6.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"

[lib]
name = "photocraft_psd"
path = "src/lib.rs"

[features]
corpus = []
default = []
serde = ["dep:serde"]
testgen = []

[dependencies]
thiserror = "2"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
serde = { version = "1", features = ["derive", "rc"], optional = true }

[dev-dependencies]
proptest = "1"
photocraft-psd = { path = ".", features = ["testgen"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
