# Flatpak manifest — Compositor Linux port (plan-converged baseline).
#
# Converges to the port plan's Stage 0 platform baseline:
#   - Runtime: Freedesktop 26.08 (branch, not point release).
#   - Qt 6.11.2: provided by org.kde.Sdk//6.11, which extends Freedesktop
#     26.08.1 and bundles Qt 6.11.2. The plan permits bundling "only the
#     needed Qt parts" over the Freedesktop platform; KDE SDK 6.11 is the
#     maintained Flatpak distribution of Qt 6.11.2 on Freedesktop 26.08.
#     Source-bundling Qt 6.11.2 is a separate spike (disk-heavy, deferred).
#   - Swift: org.freedesktop.Sdk.Extension.swift6//26.08 (Swift 6.3.3).
#     Plan §8.2 prefers Swift 6.4; only the static-SDK artifactbundle exists
#     for 6.4.0 (cross-compile SDK), not a regular Linux archive. The
#     extension is verified, installed, and matches the existing 408-test
#     suite. Swapping in Swift 6.4 later needs no source change.
#   - Skia: pinned canvaskit/0.42.0, GPU + Vulkan enabled (plan §8.4).
#   - OpenCV: 4.14.0 (plan §8.5), core+imgproc only.
#
# Sandbox: tightened to plan §8.6 (no home/host grants; portal-driven).
#   - No --filesystem grants; all file access routes through the XDG
#     FileChooser and Documents portals (plan §8.8).
#
# Build runs entirely inside the Flatpak SDK sandbox. Nothing links the build
# host's installed system libraries.

app-id: com.wonderassembly.Compositor
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk

# Swift toolchain. The extension branch tracks the Freedesktop base: KDE 6.11
# extends Freedesktop 26.08, so the matching extension branch is 26.08
# (provides Swift 6.3.3).
sdk-extensions:
  - org.freedesktop.Sdk.Extension.swift6

command: compositor

finish-args:
  - --share=ipc            # Qt platform plugin IPC
  - --socket=fallback-x11   # Qt windowing (X11 fallback)
  - --socket=wayland        # Qt windowing (Wayland, preferred)
  - --device=dri            # GPU: Vulkan + GL (plan §8.6, §8.7)
  # Plan §8.6: no --filesystem=home/host, no --share=network.
  # All file access routes through the XDG FileChooser/Documents portals
  # (plan §8.8); no --filesystem grants required.
  - --talk-name=org.freedesktop.portal.*   # FileChooser, Documents, Clipboard portals

# Strip static archives post-link (they are consumed at build time).
cleanup:
  - '*.a'

modules:
  # ───────────────────────── Module 1: Skia (vendored, static, GPU+Vulkan) ─
  - name: skia
    buildsystem: simple
    # Skia needs python3 + ninja from the SDK. Vulkan headers/loader come
    # from the Freedesktop 26.08 SDK (vulkan 1.4.357 pkgconfig).
    # git-sync-deps below clones Skia's own third-party dependencies (not vendored in the
    # canvaskit/0.42.0 tarball), so this module alone needs build-time network access. This is the
    # sandboxed build environment's network, unrelated to the finished app's runtime sandbox (which
    # stays locked down: no --share=network there, see the top-level finish-args/§8.6 note above).
    build-options:
      build-args:
        - --share=network
    build-commands:
      - python3 tools/git-sync-deps
      - |
        bin/gn gen out/Static --args='
            is_official_build=true
            skia_enable_ganesh=true
            skia_use_vulkan=true
            skia_use_gl=true
            skia_use_egl=true
            skia_use_system_icu=false
            skia_use_system_zlib=false
            skia_use_system_libpng=false
            skia_use_system_libjpeg_turbo=false
            skia_use_system_libwebp=false
            skia_use_system_harfbuzz=false
            skia_use_system_freetype2=false
            skia_use_system_fontconfig=false
            skia_enable_skshaper=true
        '
      - ninja -C out/Static
      # SkPathOps (CGPath booleans) is only built with PDF/XPS; archive it next to libskia.a.
      - ninja -C out/Static pathops
      - ar rcs out/Static/libskia_pathops.a out/Static/obj/src/pathops/*.o
      - mkdir -p /app/lib /app/include/skia
      - cp out/Static/libskia.a out/Static/libskia_pathops.a /app/lib/
      - cp -r include/*.h /app/include/skia/
      - cp -r include/core/*.h /app/include/skia/
      - cp -r include/config/*.h /app/include/skia/ 2>/dev/null || true
      - cp -r include/gpu/*.h /app/include/skia/gpu/ 2>/dev/null || true
      - mkdir -p /app/include/skia/gpu/ganesh /app/include/skia/gpu/vk
      - cp -r include/gpu/ganesh/*.h /app/include/skia/gpu/ganesh/ 2>/dev/null || true
      - cp -r include/gpu/vk/*.h /app/include/skia/gpu/vk/ 2>/dev/null || true
    sources:
       - type: archive
         url: https://github.com/google/skia/archive/refs/tags/canvaskit%2F0.42.0.tar.gz
         sha256: 3b574f9b0315d00b54c611ff6d827c29a1b65121ceed7278b451c20f0f8516a1

  # ───────────────────────── Module 2: OpenCV (vendored, static, minimal) ─
  - name: opencv
    buildsystem: cmake-ninja
    config-opts:
      - -DBUILD_LIST=core,imgproc
      - -DBUILD_SHARED_LIBS=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_DOCS=OFF
      - -DBUILD_PERF_TESTS=OFF
      - -DBUILD_opencv_python2=OFF
      - -DBUILD_opencv_python3=OFF
      - -DBUILD_ZLIB=ON
      - -DBUILD_PNG=ON
      - -DBUILD_JPEG=ON
      - -DBUILD_TIFF=OFF
      - -DBUILD_WEBP=OFF
      - -DBUILD_OPENJPEG=OFF
      - -DBUILD_OPENEXR=OFF
      - -DWITH_TIFF=OFF
      - -DWITH_WEBP=OFF
      - -DWITH_OPENJPEG=OFF
      - -DWITH_OPENEXR=OFF
      - -DWITH_V4L=OFF
      - -DWITH_GTK=OFF
      - -DWITH_GSTREAMER=OFF
      - -DWITH_FFMPEG=OFF
      - -DWITH_LAPACK=OFF
      - -DWITH_IPP=OFF
      - -DWITH_EIGEN=OFF
      - -DWITH_OPENCL=OFF
      - -DWITH_PROTOBUF=OFF
      - -DCMAKE_INSTALL_PREFIX=/app
    sources:
       - type: archive
         url: https://github.com/opencv/opencv/archive/refs/tags/4.14.0.tar.gz
         sha256: ee8fb9b30eb60850431b4656447080e3737b56e45719c92b67f245950609f86e

  # ───────────────────────── Module 3: Compositor app ─────────────────────
  - name: compositor
    buildsystem: simple
    build-options:
      # Mount the Swift toolchain (org.freedesktop.Sdk.Extension.swift6 mounts
      # at /usr/lib/sdk/swift6 in the KDE SDK sandbox). append-path makes
      # `swift` available to every build-command (each runs in its own shell,
      # so a one-line `export PATH` would not persist across commands).
      append-path: /usr/lib/sdk/swift6/bin
    build-commands:
      # (a) Build the brush compute shader (Vulkan SPIR-V).
      - python3 scripts/build-brush-shader.py
      # (b) Build the Swift core as a static library with the runtime bundled.
      - swift build -c release --static-swift-stdlib
      # (c) Configure the C++ side against KDE-SDK Qt6 + vendored Skia/OpenCV
      #     in /app, and import the freshly built Swift static lib.
      - |
        cmake -S . -B build \
          -DCMAKE_PREFIX_PATH=/app \
          -DQt6_DIR=/usr/lib/x86_64-linux-gnu/cmake/Qt6 \
          -DOpenCV_DIR=/app/lib/cmake/opencv4 \
          -DCompositorCore_SWIFT_STATIC_LIB=$PWD/.build/release/libCompositorCore.a \
          -DCOMPOSITOR_REQUIRE_VENDORED_DEPS=ON \
          -DCOMPOSITOR_ENABLE_SKIA_GPU=ON
      # (d) Build + test. Host journey test needs offscreen Qt.
      - cmake --build build
      - QT_QPA_PLATFORM=offscreen ctest --test-dir build --output-on-failure
      # (e) Install Swift composition root. A C++ main cannot bootstrap the
      # Swift runtime + Foundation on the Freedesktop Swift SDK.
      - install -Dm755 .build/release/CompositorHostBootstrap /app/bin/compositor
      # (f) Install hicolor icons (sourced from the macOS AppIcon set).
      - |
        for s in 16 32 64 128 256 512; do
          install -Dm644 \
            Compositor/Assets.xcassets/AppIcon.appiconset/app-icon-${s}.png \
            /app/share/icons/hicolor/${s}x${s}/apps/com.wonderassembly.Compositor.png
        done
      # (g) Install desktop entry + AppStream metainfo.
      - install -Dm644 flatpak/com.wonderassembly.Compositor.desktop /app/share/applications/com.wonderassembly.Compositor.desktop
      - install -Dm644 flatpak/com.wonderassembly.Compositor.metainfo.xml /app/share/metainfo/com.wonderassembly.Compositor.metainfo.xml
    sources:
       # Local source for development. Release builds replace this with the
       # exact repository commit used for the artifact.
       # Local dev source: build from the current checkout.
       - type: dir
         path: .
         skip:
           - .git
           - .build
           - .flatpak-builder
           - build
           - build-host
           - build-swift
           - build-flatpak
           - build-flatpak-minimal
           - build-cmake