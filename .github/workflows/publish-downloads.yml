name: Omuse versioned download publication

on:
  push:
    branches: ["publish-downloads/v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Reviewed version from docs/releases/downloads/vX.Y.Z.json
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: omuse-versioned-download-publication
  cancel-in-progress: false

jobs:
  check:
    name: Check the reviewed download declaration
    if: >-
      github.repository == 'Sugata-Software/Omuse' &&
      ((github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
       (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/publish-downloads/v')))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      manifest: ${{ steps.path.outputs.manifest }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify explicit publication request points to reviewed main
        id: path
        env:
          GH_TOKEN: ${{ github.token }}
          OMUSE_VERSION: ${{ inputs.version }}
        run: |
          python3 scripts/release-downloads.py --plan-publication --version "$OMUSE_VERSION" >> "$GITHUB_OUTPUT"
      - name: Verify offline publication and archive contracts
        env:
          OMUSE_MANIFEST: ${{ steps.path.outputs.manifest }}
        run: |
          python3 scripts/test-release-downloads.py
          python3 scripts/test-release-notes.py
          python3 scripts/release-downloads.py --check "$OMUSE_MANIFEST"

  publish:
    name: Attach immutable unsigned preview downloads
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Verify exact CI, source, notices and smoke checks before uploading
        env:
          GH_TOKEN: ${{ github.token }}
          OMUSE_MANIFEST: ${{ needs.check.outputs.manifest }}
        run: python3 scripts/release-downloads.py --publish "$OMUSE_MANIFEST"
