name: Legacy Compositor upstream-sync build

# The real "does upstream still compile and pass unmodified" drill. Needs the Flatpak
# org.kde.Sdk sandbox (matches the exact environment this port is developed/verified in —
# see docs/upstream-shim-worklist.md and memory linux-port-swift-sandbox-verify) and the
# swift6 SDK extension. Runs without the Skia/OpenCV bridge libraries (building those from
# source hits external git-mirror rate limits — see docs/retiring-compositorcore.md), so
# the handful of Skia-only tests are skipped here; everything else — the upstream
# Document/IO/Rendering compile itself, and the non-Skia compat/override tests — is not.
#
# Retained for the preserved Swift/Qt implementation. Run manually on a legacy
# branch; Omuse's active main branch is qualified by rust-validation.yml.
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Merge latest upstream/main
        run: |
          git remote add upstream https://github.com/robbietilton/Compositor.git
          git fetch upstream main
          git -c user.email=ci@localhost -c user.name=ci merge --no-edit upstream/main
          bash scripts/check-upstream-clean.sh

      - name: Install Flatpak + KDE SDK
        run: |
          sudo apt-get update && sudo apt-get install -y flatpak
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install -y --noninteractive flathub org.kde.Sdk//6.10
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.swift6//25.08 || \
          sudo flatpak install -y --noninteractive flathub org.freedesktop.Sdk.Extension.swift6

      - name: swift build --build-tests (upstream Document/IO/Rendering unmodified)
        run: |
          flatpak run --command=sh --devel --filesystem="$PWD" org.kde.Sdk//6.10 -c \
            'cd "$1" && PATH=/usr/lib/sdk/swift6/bin:$PATH swift build --build-tests' sh "$PWD"

      - name: swift test (non-Skia suites — no COMPOSITOR_SKIA_BRIDGE in CI)
        run: |
          flatpak run --command=sh --devel --filesystem="$PWD" org.kde.Sdk//6.10 -c \
            'cd "$1" && PATH=/usr/lib/sdk/swift6/bin:$PATH swift test' sh "$PWD"
