name: Legacy Compositor upstream-sync guard

# Fast, no-Flatpak-SDK-needed gate: catches any accidental edit to the protected upstream
# trees (Compositor/, CompositorTests/) before it lands, and keeps a fresh symbol-parity
# report as a build artifact. The full compile-and-test drill lives in ci-build.yml —
# separate because it needs the Flatpak org.kde.Sdk sandbox and vendored Skia/OpenCV
# (tens of minutes), which shouldn't gate every push.
on:
  push:
    branches: [GNU_Linux]
  pull_request:
    branches: [GNU_Linux]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-upstream-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - name: Add upstream remote
        run: |
          git remote add upstream https://github.com/robbietilton/Compositor.git
          git fetch upstream main
      - name: Protected trees must match upstream/main
        run: UPSTREAM_REF=upstream/main bash scripts/check-upstream-clean.sh

  upstream-symbol-audit:
    runs-on: ubuntu-latest
    needs: check-upstream-clean
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.x'
      - name: Generate symbol-parity report
        run: python3 scripts/upstream-audit.py --json upstream-audit.json --csv upstream-audit.csv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: upstream-audit-report
          path: |
            upstream-audit.json
            upstream-audit.csv
