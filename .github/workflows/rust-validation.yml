name: Omuse Rust validation

on:
  push:
    branches: [main, 'release/**']
    paths:
      - 'rust/**'
      - 'scripts/build-rust.sh'
      - 'scripts/build-rust.ps1'
      - 'scripts/prepare-rust-assets.ps1'
      - 'scripts/package-rust.ps1'
      - '.cargo/config.toml'
      - '.gitattributes'
      - 'scripts/prepare-rust-assets.sh'
      - 'scripts/install-rust.sh'
      - 'install.sh'
      - 'scripts/install-app.py'
      - 'scripts/test-install.py'
      - 'scripts/generate-rust-kernel-fixtures.py'
      - 'scripts/test-rust.sh'
      - 'scripts/native-rust-check.py'
      - 'scripts/native-display-check.py'
      - 'scripts/rust-release-qualification.py'
      - 'scripts/create-recovery-check.py'
      - 'scripts/package-rust.sh'
      - 'scripts/install-rust-bundle.sh'
      - 'scripts/test-rust-bundle.py'
      - 'scripts/rust-license-inventory.py'
      - 'scripts/test-rust-license-inventory.py'
      - '.github/workflows/rust-validation.yml'
      - 'rust-toolchain.toml'
  pull_request:
    branches: [main]
    paths:
      - 'rust/**'
      - 'scripts/build-rust.sh'
      - 'scripts/build-rust.ps1'
      - 'scripts/prepare-rust-assets.ps1'
      - 'scripts/package-rust.ps1'
      - '.cargo/config.toml'
      - '.gitattributes'
      - 'scripts/prepare-rust-assets.sh'
      - 'scripts/install-rust.sh'
      - 'install.sh'
      - 'scripts/install-app.py'
      - 'scripts/test-install.py'
      - 'scripts/generate-rust-kernel-fixtures.py'
      - 'scripts/test-rust.sh'
      - 'scripts/native-rust-check.py'
      - 'scripts/native-display-check.py'
      - 'scripts/rust-release-qualification.py'
      - 'scripts/create-recovery-check.py'
      - 'scripts/package-rust.sh'
      - 'scripts/install-rust-bundle.sh'
      - 'scripts/test-rust-bundle.py'
      - 'scripts/rust-license-inventory.py'
      - 'scripts/test-rust-license-inventory.py'
      - '.github/workflows/rust-validation.yml'
      - 'rust-toolchain.toml'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rust-validation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Linux installer and reference fixtures
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Verify installation, update, rollback and archive integrity
        run: |
          bash -n install.sh scripts/install-rust.sh scripts/install-rust-bundle.sh scripts/prepare-rust-assets.sh
          python3 scripts/test-install.py
          python3 scripts/test-rust-bundle.py
          python3 scripts/generate-rust-kernel-fixtures.py
          git diff --exit-code -- rust/tests/fixtures

  validate:
    name: Omuse format, check, UI tests, and editing journey
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install documented Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential \
            pkg-config \
            libwayland-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libfontconfig1-dev \
            liblcms2-dev \
            ffmpeg
          pkg-config --modversion wayland-client xkbcommon xkbcommon-x11 fontconfig lcms2

      - name: Install the exercised Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version

      - name: Cache locked Cargo inputs and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: omuse-rust-validation-ubuntu-24.04-rust-1.98.0-${{ hashFiles('rust/Cargo.lock') }}
          restore-keys: |
            omuse-rust-validation-ubuntu-24.04-rust-1.98.0-

      - name: Check all Rust targets with the UI test surface
        run: >-
          cargo check
          --manifest-path rust/Cargo.toml
          --release
          --locked
          --all-targets
          --features ui-test
          --jobs "$CARGO_BUILD_JOBS"

      - name: Run the Rust release validation suite
        env:
          OMUSE_TEST_KEEP: '1'
          TMPDIR: ${{ runner.temp }}
        run: scripts/test-rust.sh

      - name: Retain editable-template and carousel render evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omuse-create-renders
          path: |
            ${{ runner.temp }}/omuse-tests.*/journey/results.json
            ${{ runner.temp }}/omuse-tests.*/template-catalog/*.png
            ${{ runner.temp }}/omuse-tests.*/template-catalog/results.json
            ${{ runner.temp }}/omuse-tests.*/create-journey/social-export
            ${{ runner.temp }}/omuse-tests.*/create-journey/*.png
            ${{ runner.temp }}/omuse-tests.*/create-journey/*.mp4
            ${{ runner.temp }}/omuse-tests.*/create-journey/*.gif
          if-no-files-found: warn

      - name: Qualify motion exports and interrupted collection saves
        run: |
          cargo run --manifest-path rust/Cargo.toml --release --locked --example media_acceptance -- "$RUNNER_TEMP/omuse-media"
          cargo build --manifest-path rust/Cargo.toml --release --locked --example create_recovery_fixture
          python3 scripts/create-recovery-check.py "$RUNNER_TEMP/omuse-create-recovery" --fixture "$GITHUB_WORKSPACE/rust/target/release/examples/create_recovery_fixture"

      - name: Retain motion and recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omuse-create-media-recovery
          path: |
            ${{ runner.temp }}/omuse-media
            ${{ runner.temp }}/omuse-create-recovery
          if-no-files-found: warn

      - name: Verify dependency notice overrides
        run: |
          python3 scripts/test-rust-license-inventory.py
          python3 scripts/rust-license-inventory.py "$RUNNER_TEMP/omuse-notices"

      - name: Retain dependency review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omuse-dependency-notices
          path: ${{ runner.temp }}/omuse-notices

  windows:
    name: Windows build, tests and journey
    runs-on: windows-2025
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: '4'
      CARGO_INCREMENTAL: '0'
      RUST_BACKTRACE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install the exercised Rust toolchain
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          rustup default 1.98.0
          rustc --version --verbose
          cargo --version

      - name: Cache locked Cargo inputs and build outputs
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: omuse-windows-2025-rust-1.98.0-${{ hashFiles('rust/Cargo.lock', '.cargo/config.toml') }}
          restore-keys: |
            omuse-windows-2025-rust-1.98.0-

      - name: Cache pinned Windows runtime assets
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: rust/runtime
          key: omuse-windows-runtime-${{ hashFiles('scripts/prepare-rust-assets.ps1') }}

      - name: Prepare Camera RAW and subject-selection runtime assets
        run: ./scripts/prepare-rust-assets.ps1

      - name: Install pinned FFmpeg for motion export journeys
        run: |
          $archive = Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-essentials_build.zip'
          curl.exe --fail --location --retry 2 --proto '=https' --tlsv1.2 --silent --show-error `
            https://github.com/GyanD/codexffmpeg/releases/download/9.0.2/ffmpeg-9.0.2-essentials_build.zip --output $archive
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($hash -ne '60f467265b1e312373dbcd92200c2618a74850f98d3d078e94296bb3fa2047ba') { throw "FFmpeg checksum mismatch: $hash" }
          Expand-Archive -LiteralPath $archive -DestinationPath $env:RUNNER_TEMP
          Join-Path $env:RUNNER_TEMP 'ffmpeg-9.0.2-essentials_build/bin' | Out-File -Append -Encoding utf8 $env:GITHUB_PATH

      - name: Create disposable XDG directories
        run: |
          foreach ($name in 'data', 'config', 'cache', 'state') {
            New-Item -ItemType Directory -Force (Join-Path $env:RUNNER_TEMP "omuse-tests/$name") | Out-Null
          }

      - name: Run the Rust tests with the UI test surface
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/omuse-tests/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/omuse-tests/config
          XDG_CACHE_HOME: ${{ runner.temp }}/omuse-tests/cache
          XDG_STATE_HOME: ${{ runner.temp }}/omuse-tests/state
        run: >-
          cargo test
          --manifest-path rust/Cargo.toml
          --release
          --locked
          --features ui-test
          --jobs $env:CARGO_BUILD_JOBS
          -- --test-threads=1

      - name: Run the editing self-test journey
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/omuse-tests/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/omuse-tests/config
          XDG_CACHE_HOME: ${{ runner.temp }}/omuse-tests/cache
          XDG_STATE_HOME: ${{ runner.temp }}/omuse-tests/state
        run: >-
          cargo run
          --manifest-path rust/Cargo.toml
          --release
          --locked
          --features ui-test
          --jobs $env:CARGO_BUILD_JOBS
          -- --self-test "$env:RUNNER_TEMP/omuse-tests/journey"

      - name: Run the Create, template catalog and motion journeys
        env:
          XDG_DATA_HOME: ${{ runner.temp }}/omuse-tests/data
          XDG_CONFIG_HOME: ${{ runner.temp }}/omuse-tests/config
          XDG_CACHE_HOME: ${{ runner.temp }}/omuse-tests/cache
          XDG_STATE_HOME: ${{ runner.temp }}/omuse-tests/state
        run: |
          cargo run --manifest-path rust/Cargo.toml --release --locked --jobs $env:CARGO_BUILD_JOBS --example create_acceptance -- "$env:RUNNER_TEMP/omuse-tests/create-journey" --motion
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path rust/Cargo.toml --release --locked --jobs $env:CARGO_BUILD_JOBS --example catalog_acceptance -- "$env:RUNNER_TEMP/omuse-tests/template-catalog"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo run --manifest-path rust/Cargo.toml --release --locked --jobs $env:CARGO_BUILD_JOBS --example media_acceptance -- "$env:RUNNER_TEMP/omuse-tests/media"

      - name: Build the Windows editor
        run: ./scripts/build-rust.ps1

      - name: Package the Windows development build
        run: ./scripts/package-rust.ps1 -Binary rust/target/release/omuse.exe -Output dist/omuse-windows-x86_64.zip

      - name: Retain the unsigned Windows development package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: omuse-windows-x86_64-unsigned
          path: dist/omuse-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 14
